services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pulsestream
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${PULSE_DB_PASSWORD:?Set PULSE_DB_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulsestream"]
      interval: 3s
      timeout: 3s
      retries: 20
  telemetry:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      PULSE_DATABASE_URL: "host=postgres dbname=pulsestream user=pulse password=${PULSE_DB_PASSWORD}"
      PULSE_OPERATOR_TOKEN: ${PULSE_OPERATOR_TOKEN:?Set PULSE_OPERATOR_TOKEN}
      PULSE_CLINICS: ${PULSE_CLINICS:?Set PULSE_CLINICS}
    volumes: ["wal-data:/data/wal"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.secrets/prometheus-token:/etc/prometheus/pulse-token:ro
    profiles: ["monitoring"]
    depends_on: [telemetry]
volumes:
  postgres-data:
  wal-data:
